[package]
name = "rust_lib_panda_playground"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
anyhow = "1.0"
flutter_rust_bridge = "=2.12.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2.2"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", default-features = false }
hex = "0.4"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# p2panda modular crates (bumped from a1308c1/v0.5.1 -> 3738fc0/v0.5.2 for iroh 0.98 + WASM support)
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "3738fc0fc60641af430fc8d6c6393c73f0610b4e" }
p2panda-discovery = { git = "https://github.com/p2panda/p2panda", rev = "3738fc0fc60641af430fc8d6c6393c73f0610b4e" }
p2panda-net = { git = "https://github.com/p2panda/p2panda", rev = "3738fc0fc60641af430fc8d6c6393c73f0610b4e" }
p2panda-store = { git = "https://github.com/p2panda/p2panda", rev = "3738fc0fc60641af430fc8d6c6393c73f0610b4e", features = ["sqlite"], default-features = false }
p2panda-stream = { git = "https://github.com/p2panda/p2panda", rev = "3738fc0fc60641af430fc8d6c6393c73f0610b4e" }
p2panda-sync = { git = "https://github.com/p2panda/p2panda", rev = "3738fc0fc60641af430fc8d6c6393c73f0610b4e" }

# Native-only deps. audiopus FFI-binds libopus C; build script fails on wasm32 (no libc).
# On web, opus encode/decode happens Dart-side via MediaRecorder + WebCodecs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
audiopus = "0.3.0-rc.0"

# Platform-specific logging
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13.1"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

# Native voice resolves iroh from crates.io and p2panda from the git rev pinned above.
# WASM testing of in-flight upstream PRs (iroh #4238, p2panda-net tokio-gating) is done
# out-of-tree against ~/git/experiments/iroh-final and ~/git/experiments/p2panda-v0.5.2
# via a local-only Cargo.toml patch block — not committed here, since path-based patches
# break for anyone cloning the repo.
